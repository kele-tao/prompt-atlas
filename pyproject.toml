[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-atlas"
version = "1.0.0"
description = "Lint, score and diff LLM prompts like source code: 20 static rules, a 0-100 quality score, section-aware diffs and self-contained HTML reports. Pure Python, zero deps."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "kele" }]
keywords = ["llm", "prompt-engineering", "static-analysis", "cli", "prompts"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
prompt-atlas = "prompt_atlas.cli:main"

[project.urls]
Homepage = "https://github.com/kele-tao/prompt-atlas"
Issues = "https://github.com/kele-tao/prompt-atlas/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt_atlas = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP031"]