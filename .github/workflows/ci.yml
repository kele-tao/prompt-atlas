name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: python -m prompt_atlas --help
      - name: Lint the bundled examples (expected to find issues)
        run: python -m prompt_atlas lint examples --no-color --json > /tmp/lint.json
      - name: Quality gate on the good example
        run: python -m prompt_atlas score examples/support-agent.md --min-score 90 --no-color
      - name: Render the HTML report
        run: python -m prompt_atlas report examples --out report.html
      - uses: actions/upload-artifact@v4
        with:
          name: report-py${{ matrix.python-version }}
          path: report.html

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python benchmarks/run.py
      - run: git diff --exit-code benchmarks/results.json || echo "benchmark numbers moved (expected on a different CPU)"
